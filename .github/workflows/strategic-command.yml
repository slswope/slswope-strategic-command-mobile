name: Strategic Command — official feeds and iPhone dashboard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *' # approximately every 30 min (UTC); GitHub may delay runs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strategic-command-publish
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
  monitor-and-publish:
    needs: tests
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Collect official-source data and optional alerts
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: python3 scripts/update.py
      - name: Save alert deduplication state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/notified.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update notification deduplication state [skip ci]'
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
  verify-mobile:
    needs: monitor-and-publish
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the published dashboard at phone widths
        env:
          DASHBOARD_URL: ${{ needs.monitor-and-publish.outputs.page_url }}
        run: |
          npm install --prefix "$RUNNER_TEMP/dashboard-check" --no-save playwright@1.58.2
          NODE_PATH="$RUNNER_TEMP/dashboard-check/node_modules" node tests/mobile-smoke.cjs
